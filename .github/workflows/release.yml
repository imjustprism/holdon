name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: build (cross)
        if: matrix.cross
        shell: bash
        run: cross build --locked --release --target ${{ matrix.target }} --all-features

      - name: build (cargo)
        if: ${{ !matrix.cross }}
        shell: bash
        run: cargo build --locked --release --target ${{ matrix.target }} --all-features

      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="holdon-${TARGET}"
          mkdir -p "dist/${name}"
          if [[ "${TARGET}" == *windows* ]]; then
            cp "target/${TARGET}/release/holdon.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/holdon" "dist/${name}/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          cd dist
          if [[ "${ARCHIVE}" == "zip" ]]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: holdon-${{ matrix.target }}
          path: dist/holdon-${{ matrix.target }}.*
          if-no-files-found: error

  completions:
    name: completions and manpage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --locked --all-features
      - name: generate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/completions out/man
          bin="./target/release/holdon"
          for sh in bash zsh fish power-shell elvish; do
            case "$sh" in
              power-shell) name="powershell"; ext="ps1" ;;
              *) name="$sh"; ext="$sh" ;;
            esac
            "$bin" --generate-completion "$sh" > "out/completions/holdon.${ext}"
          done
          "$bin" --generate-manpage > "out/man/holdon.1"
          (cd out && tar -czf ../holdon-completions-and-manpage.tar.gz completions man)
      - uses: actions/upload-artifact@v7
        with:
          name: completions-and-manpage
          path: holdon-completions-and-manpage.tar.gz
          if-no-files-found: error

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - run: cargo cyclonedx --all-features --format json --override-filename holdon-sbom
      - name: locate sbom
        shell: bash
        run: |
          set -euo pipefail
          path="$(find . -name 'holdon-sbom*.json' -print -quit)"
          if [[ -z "${path}" ]]; then
            echo "no sbom file produced"; exit 1
          fi
          mkdir -p sbom-out
          cp "${path}" sbom-out/holdon-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-out/holdon-sbom.cdx.json
          if-no-files-found: error

  release:
    name: github release
    needs: [build, sbom, completions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum holdon-* > SHA256SUMS

      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/holdon-*"

      - uses: sigstore/cosign-installer@v3
      - name: cosign sign checksums
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          cd dist
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          make_latest: "legacy"
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}

  publish:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  docker:
    name: docker image
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derive version
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "semver=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/imjustprism/holdon:${{ steps.ver.outputs.semver }}
            ghcr.io/imjustprism/holdon:latest
          labels: |
            org.opencontainers.image.source=https://github.com/imjustprism/holdon
            org.opencontainers.image.version=${{ steps.ver.outputs.semver }}
            org.opencontainers.image.revision=${{ github.sha }}

  bump-homebrew:
    name: bump homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: skip if HOMEBREW_TAP_TOKEN missing
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN secret not configured, skipping"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: imjustprism/homebrew-holdon
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-holdon
      - if: steps.gate.outputs.skip != 'true'
        name: bump formula
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          version="${tag#v}"
          sums=$(curl -fsSL "https://github.com/imjustprism/holdon/releases/download/${tag}/SHA256SUMS")
          pick() { echo "$sums" | awk -v f="$1" '$2==f{print $1}'; }
          mac_arm=$(pick "holdon-aarch64-apple-darwin.tar.gz")
          mac_x86=$(pick "holdon-x86_64-apple-darwin.tar.gz")
          lin_arm=$(pick "holdon-aarch64-unknown-linux-musl.tar.gz")
          lin_x86=$(pick "holdon-x86_64-unknown-linux-musl.tar.gz")
          for v in mac_arm mac_x86 lin_arm lin_x86; do
            if [ -z "${!v}" ]; then echo "missing sha for $v" >&2; exit 1; fi
          done
          base="https://github.com/imjustprism/holdon/releases/download/v${version}"
          cat > homebrew-holdon/Formula/holdon.rb <<RUBY
          class Holdon < Formula
            desc "Wait for anything. Know why if it doesn't."
            homepage "https://github.com/imjustprism/holdon"
            version "${version}"
            license "MIT OR Apache-2.0"

            on_macos do
              on_arm do
                url "${base}/holdon-aarch64-apple-darwin.tar.gz"
                sha256 "${mac_arm}"
              end
              on_intel do
                url "${base}/holdon-x86_64-apple-darwin.tar.gz"
                sha256 "${mac_x86}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/holdon-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${lin_arm}"
              end
              on_intel do
                url "${base}/holdon-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${lin_x86}"
              end
            end

            def install
              bin.install "holdon"
              generate_completions_from_executable(bin/"holdon", "--generate-completion")
            end

            test do
              assert_match "holdon", shell_output("#{bin}/holdon --version")
            end
          end
          RUBY
          cd homebrew-holdon
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/holdon.rb
          git commit -m "holdon: bump to ${version}"
          git push

  bump-scoop:
    name: bump scoop bucket
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: skip if SCOOP_BUCKET_TOKEN missing
        id: gate
        env:
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SCOOP_BUCKET_TOKEN secret not configured, skipping"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: imjustprism/scoop-holdon
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-holdon
      - if: steps.gate.outputs.skip != 'true'
        name: bump scoop manifest
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          version="${tag#v}"
          sha=$(curl -fsSL "https://github.com/imjustprism/holdon/releases/download/${tag}/SHA256SUMS" \
            | awk '/holdon-x86_64-pc-windows-msvc\.zip$/{print $1}')
          if [ -z "$sha" ]; then
            echo "could not resolve windows zip sha for ${tag}" >&2
            exit 1
          fi
          cat > scoop-holdon/bucket/holdon.json <<JSON
          {
            "version": "${version}",
            "description": "Wait for anything. Know why if it doesn't.",
            "homepage": "https://github.com/imjustprism/holdon",
            "license": "MIT OR Apache-2.0",
            "url": "https://github.com/imjustprism/holdon/releases/download/v${version}/holdon-x86_64-pc-windows-msvc.zip",
            "hash": "${sha}",
            "extract_dir": "holdon-x86_64-pc-windows-msvc",
            "bin": "holdon.exe",
            "checkver": { "github": "https://github.com/imjustprism/holdon" },
            "autoupdate": {
              "url": "https://github.com/imjustprism/holdon/releases/download/v\$version/holdon-x86_64-pc-windows-msvc.zip",
              "extract_dir": "holdon-x86_64-pc-windows-msvc",
              "hash": { "url": "https://github.com/imjustprism/holdon/releases/download/v\$version/SHA256SUMS" }
            }
          }
          JSON
          cd scoop-holdon
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/holdon.json
          git commit -m "holdon: bump to ${version}"
          git push


version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tokio:
        patterns: ["tokio*"]
      tracing:
        patterns: ["tracing*"]
      reqwest-stack:
        patterns: ["reqwest", "hyper*", "rustls*", "h2"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
